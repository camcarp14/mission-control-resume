<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <rect width="1200" height="750" fill="#0d0f13"/>

  <!-- Header band -->
  <text x="48" y="72" fill="#e8e6e1" font-size="15" letter-spacing="3">DELIVERY OVERVIEW — GNC · PAID SEARCH</text>
  <rect x="1000" y="48" width="152" height="30" fill="none" stroke="rgba(255,255,255,0.14)" rx="3"/>
  <text x="1076" y="67" fill="#e8e6e1" fill-opacity="0.6" font-size="11" text-anchor="middle" letter-spacing="1">FIVE-WEEK VIEW ▾</text>
  <line x1="48" y1="100" x2="1152" y2="100" stroke="rgba(255,255,255,0.14)"/>

  <!-- KPI tiles -->
  <g fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.14)">
    <rect x="48" y="124" width="258" height="104" rx="3"/>
    <rect x="336" y="124" width="258" height="104" rx="3"/>
    <rect x="624" y="124" width="258" height="104" rx="3"/>
    <rect x="912" y="124" width="258" height="104" rx="3"/>
  </g>
  <g fill="#e8e6e1" fill-opacity="0.5" font-size="10" letter-spacing="2">
    <text x="68" y="152">BRAND ROAS</text>
    <text x="356" y="152">SPEND — YOY</text>
    <text x="644" y="152">REVENUE — YOY</text>
    <text x="932" y="152">NON-BRAND ROAS — WOW</text>
  </g>
  <g fill="#e8e6e1" font-size="27">
    <text x="68" y="190">$8.80</text>
    <text x="356" y="190">−13%</text>
    <text x="644" y="190">$1.32M</text>
    <text x="932" y="190">+86%</text>
  </g>
  <g fill="#e8e6e1" fill-opacity="0.45" font-size="10" letter-spacing="1">
    <text x="68" y="212">▲ FROM $7.30 · FIVE WEEKS</text>
    <text x="356" y="212">WALKED DOWN VIA BID PORTFOLIOS</text>
    <text x="644" y="212">▲ +5% VS $1.26M LY</text>
    <text x="932" y="212">CPC −33% · CONV RATE +17%</text>
  </g>

  <!-- ROAS vs spend trend -->
  <rect x="48" y="256" width="736" height="300" fill="none" stroke="rgba(255,255,255,0.14)" rx="3"/>
  <text x="68" y="286" fill="#e8e6e1" fill-opacity="0.6" font-size="11" letter-spacing="2">BRAND SEARCH — ROAS VS SPEND · WEEKLY</text>

  <g stroke="rgba(255,255,255,0.08)">
    <line x1="68" y1="316" x2="764" y2="316"/>
    <line x1="68" y1="376" x2="764" y2="376"/>
    <line x1="68" y1="436" x2="764" y2="436"/>
    <line x1="68" y1="496" x2="764" y2="496"/>
  </g>
  <g fill="#e8e6e1" fill-opacity="0.35" font-size="9" letter-spacing="1" text-anchor="middle">
    <text x="100" y="540">WK 1</text>
    <text x="258" y="540">WK 2</text>
    <text x="416" y="540">WK 3</text>
    <text x="574" y="540">WK 4</text>
    <text x="732" y="540">WK 5</text>
  </g>

  <!-- Spend series — walked down -->
  <polyline points="100,368 258,388 416,412 574,440 732,462" fill="none" stroke="#e8e6e1" stroke-opacity="0.35" stroke-dasharray="4 4"/>
  <text x="756" y="484" fill="#e8e6e1" fill-opacity="0.45" font-size="9" letter-spacing="1" text-anchor="end">SPEND −13% YOY</text>

  <!-- ROAS series — the single accent -->
  <polyline points="100,490 258,462 416,424 574,376 732,330" fill="none" stroke="#ff5c37" stroke-width="1.5"/>
  <circle cx="732" cy="330" r="2.5" fill="#ff5c37"/>
  <text x="100" y="512" fill="#e8e6e1" fill-opacity="0.45" font-size="9" letter-spacing="1" text-anchor="middle">$7.30</text>
  <text x="756" y="322" fill="#ff5c37" font-size="9" letter-spacing="1" text-anchor="end">ROAS $8.80</text>

  <!-- The reinvestment decision -->
  <rect x="816" y="256" width="336" height="300" fill="none" stroke="rgba(255,255,255,0.14)" rx="3"/>
  <text x="836" y="286" fill="#e8e6e1" fill-opacity="0.6" font-size="11" letter-spacing="2">THE REINVESTMENT CALL</text>

  <rect x="836" y="302" width="296" height="54" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.14)"/>
  <text x="984" y="324" fill="#e8e6e1" fill-opacity="0.75" font-size="11" letter-spacing="2" text-anchor="middle">BRAND CPC WALK-DOWN</text>
  <text x="984" y="344" fill="#e8e6e1" fill-opacity="0.45" font-size="10" letter-spacing="1" text-anchor="middle">spend −13% · ROAS $7.30 → $8.80</text>

  <line x1="984" y1="356" x2="984" y2="370" stroke="rgba(255,255,255,0.14)"/>

  <rect x="836" y="370" width="296" height="54" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.14)"/>
  <text x="984" y="392" fill="#e8e6e1" fill-opacity="0.75" font-size="11" letter-spacing="2" text-anchor="middle">SAVINGS REFRAMED</text>
  <text x="984" y="412" fill="#e8e6e1" fill-opacity="0.45" font-size="10" letter-spacing="1" text-anchor="middle">portfolio strategy — not a line item</text>

  <line x1="984" y1="424" x2="984" y2="438" stroke="rgba(255,255,255,0.14)"/>

  <rect x="836" y="438" width="296" height="54" rx="3" fill="none" stroke="#ff5c37"/>
  <text x="984" y="460" fill="#ff5c37" font-size="11" letter-spacing="2" text-anchor="middle">REINVEST → SHOPPING</text>
  <text x="984" y="480" fill="#e8e6e1" fill-opacity="0.55" font-size="10" letter-spacing="1" text-anchor="middle">the more incremental tactic</text>

  <g fill="#e8e6e1" fill-opacity="0.45" font-size="9" letter-spacing="1" text-anchor="middle">
    <text x="984" y="520">organic absorbed the displaced</text>
    <text x="984" y="536">brand traffic at no cost</text>
  </g>

  <!-- Channel table — week over week -->
  <rect x="48" y="580" width="1104" height="126" fill="none" stroke="rgba(255,255,255,0.14)" rx="3"/>
  <g fill="#e8e6e1" fill-opacity="0.45" font-size="10" letter-spacing="2">
    <text x="68" y="606">CHANNEL</text>
    <text x="460" y="606">REVENUE WOW</text>
    <text x="680" y="606">SPEND WOW</text>
    <text x="880" y="606">THE READ</text>
  </g>
  <line x1="48" y1="618" x2="1152" y2="618" stroke="rgba(255,255,255,0.14)"/>
  <g fill="#e8e6e1" fill-opacity="0.75" font-size="11">
    <text x="68" y="642">BRAND TEXT</text>
    <text x="460" y="642">+17%</text>
    <text x="680" y="642">+1%</text>
  </g>
  <text x="880" y="642" fill="#e8e6e1" fill-opacity="0.45" font-size="10" letter-spacing="1">efficiency, not volume</text>
  <line x1="48" y1="652" x2="1152" y2="652" stroke="rgba(255,255,255,0.08)"/>
  <g fill="#e8e6e1" fill-opacity="0.75" font-size="11">
    <text x="68" y="672">SHOPPING</text>
    <text x="460" y="672">+2%</text>
    <text x="680" y="672">−8%</text>
  </g>
  <text x="880" y="672" fill="#e8e6e1" fill-opacity="0.45" font-size="10" letter-spacing="1">reinvestment target</text>
  <line x1="48" y1="682" x2="1152" y2="682" stroke="rgba(255,255,255,0.08)"/>
  <g fill="#e8e6e1" fill-opacity="0.75" font-size="11">
    <text x="68" y="700">NON-BRAND</text>
    <text x="460" y="700">+20%</text>
    <text x="680" y="700">▲ SCALING</text>
  </g>
  <text x="880" y="700" fill="#e8e6e1" fill-opacity="0.45" font-size="10" letter-spacing="1">post-restructure scale-up</text>
</svg>
