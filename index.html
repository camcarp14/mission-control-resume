<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08090b" />
    <title>Mission Control</title>
    <meta
      name="description"
      content="An interactive flight through a Solutions Consultant's career — piloted, not scrolled."
    />
    <!--
      Ground colour is painted by the document itself, before any CSS or JS
      arrives. This is what buys "zero blank frame" on a cold 3G load — the
      shell is dark from the first paint instead of flashing white.
    -->
    <style>
      html { background: #08090b; color-scheme: dark; }
      body { margin: 0; background: #08090b; color: #e8e6e1; }
      #root { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
