<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08090b" />
    <!-- The name leads. A bookmark, a browser-history entry, and a Google
         search for "Cameron Carpenter" are all keyed off this string, and "Mission
         Control" alone attributes the page to nobody. Role last, so the tab
         still reads when the title is truncated to ~30 characters. -->
    <title>Cameron Carpenter — Applied AI &amp; Performance Marketing</title>
    <meta
      name="description"
      content="Cameron Carpenter is an applied AI builder with a performance marketer’s sense of the business — Claude skills, agents, and evals for regulated healthcare, and a résumé you can pilot."
    />
    <!-- ORIGIN — the cutover happened, and here is the evidence trail so
         nobody un-flips this on a stale memory: camcarp.com moved onto Netlify
         DNS (dns1-4.p06.nsone.net), resolves to the same pair of addresses as
         the netlify.app host, Netlify reports it as the site's primary URL,
         and the certificate provisioned. Netlify now 301s the netlify.app
         mirror to camcarp.com, which makes this five-line flip mandatory
         rather than cosmetic — an og:url that answers with a redirect is a
         coin flip in some scrapers. The five origin-bearing lines are
         canonical, og:url, og:image, twitter:image, and the JSON-LD Person
         url; nothing else in this file hard-codes a host. -->
    <link rel="canonical" href="https://camcarp.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mission Control" />
    <meta property="og:url" content="https://camcarp.com/" />
    <meta property="og:title" content="Cameron Carpenter — Applied AI &amp; Performance Marketing" />
    <meta
      property="og:description"
      content="An applied AI builder with a performance marketer’s sense of the business, in regulated healthcare. Writing, the things he has built, and a résumé you can pilot."
    />
    <!-- og.jpg is a real frame of the flight — the Navy Pier finale, posed and
         captured from the running app — with the wordmark composited over the
         night sky, the one part of that frame with nothing in it. Absolute URLs
         are not optional here: LinkedIn and Slack resolve og:image against
         nothing, and a root-relative path silently yields a text-only card on
         the site whose entire pitch is that it looks spectacular. -->
    <meta property="og:image" content="https://camcarp.com/og.jpg?v=5" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Cameron Carpenter — a shuttle landed on Navy Pier under the night Chicago skyline, the final frame of the flight."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cameron Carpenter — Applied AI &amp; Performance Marketing" />
    <meta
      name="twitter:description"
      content="An applied AI builder with a performance marketer’s sense of the business, in regulated healthcare. Writing, the things he has built, and a résumé you can pilot."
    />
    <meta name="twitter:image" content="https://camcarp.com/og.jpg?v=5" />
    <meta
      name="twitter:image:alt"
      content="Cameron Carpenter — a shuttle landed on Navy Pier under the night Chicago skyline, the final frame of the flight."
    />
    <!-- Icons. Netlify's SPA catch-all (netlify.toml) rewrites every unmatched
         path to index.html, so before these files existed /favicon.ico came
         back as an HTML document with a 200 — a tab showing the anonymous
         default globe next to every competing candidate. Static files in the
         publish dir are matched before the redirect table, so shipping them is
         also what makes that path resolve honestly. None of these three is
         render-blocking: Chrome fetches the tab icon off the critical path and
         desktop browsers never request the touch icon at all. -->
    <!-- The home hero sets the name in the display face, in the shell as well
         as in React, so it is preloaded rather than discovered late. -->
    <link rel="preload" href="/fonts/SpaceGrotesk.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Person schema, so a search for the name can resolve to this page as a
         person rather than as an untitled web app. sameAs and worksFor were
         withheld until Cameron supplied the real values (inventing structured
         data about a real person was the line); they came off his own résumé,
         so they are here now. Still no email or phone — those live behind the
         gate and on the PDF, not in a machine-readable block every scraper
         reads. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Cameron Carpenter",
        "jobTitle": "Applied AI & Performance Marketing",
        "description": "Applied AI builder with a performance marketer’s sense of the business, in regulated healthcare: Claude skills, agents, and evaluations, built on several enrollment seasons of call-intelligence work.",
        "worksFor": { "@type": "Organization", "name": "Ovative Group" },
        "sameAs": ["https://www.linkedin.com/in/cameroncarpenter1"],
        "url": "https://camcarp.com/"
      }
    </script>
    <!--
      Ground colour AND the gate's headline are painted by the document
      itself, before any CSS or JS arrives. The pre-rendered shell below is
      the app's real first contentful paint: without it, the entire page
      arrives via a fade-from-opacity-0 after ~250 kB of JS, and Lighthouse
      (correctly) records NO FCP at all. React renders the identical header
      text over this markup; the shell reserves the gate's approximate height
      so the swap is position-stable, not just text-stable.
    -->
    <style>
      html { background: #08090b; color-scheme: dark; }
      /* 'Inter var' used to lead this stack and is loaded NOWHERE — public/fonts
         holds Space Grotesk and nothing else. On the minority of machines that
         happen to have Inter installed the whole site rendered in a different
         typeface than it does everywhere else, which is non-deterministic
         typography in the one file that paints before any CSS arrives. The
         stack below is the system stack the README already claims. */
      body { margin: 0; background: #08090b; color: #e8e6e1;
             font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      #root { min-height: 100dvh; }
      /* EVERY length below is rem, and that is load-bearing rather than
         stylistic. polish.css steps the root font-size to 17-19px on displays
         ≥1920 so the console does not read as a small card marooned in a huge
         frame — which means React's Splash renders this same headline at
         ~32-36px there. Authored in px, this shell would have painted it at a
         flat 30px and then let it grow the instant the stylesheet landed:
         precisely the hop the note above says CLS cannot see and eyes can,
         reintroduced on exactly the large displays a panel is most likely to
         be presented on. In rem the two agree at every width, and below 1920
         (1rem = 16px) these are byte-for-byte the measurements that were here
         before. The media query is duplicated rather than imported because
         this style block must not wait on a network request — that is the
         whole reason it exists. */
      @media (min-width: 1920px) { html { font-size: clamp(17px, 0.3125vw + 11px, 19px); } }
      /* Mirrors .home / .home-wrap / .home-head in polish.css — same padding,
         width and centring — so the header paints exactly where React will
         put it. */
      .mc-shell { min-height: 100dvh; box-sizing: border-box;
                  padding: clamp(1.5rem, 6vh, 4.5rem) 1.25rem 2.5rem; }
      .mc-shell > div { width: 100%; max-width: 76rem; margin: 0 auto; text-align: center; }
      @media (min-width: 768px) {
        .mc-shell { padding-top: max(1.25rem, calc(50vh - 19.5rem)); }
      }
      /* /articles and the article pages are a different layout; painting the
         home header for 200ms before them would be a flash of the wrong page.
         The one-line script below opts those URLs out. */
      .mc-bare .mc-shell { display: none; }
      /* /work's prerendered shell (vite.config.ts, workPage): mirrors
         .workpage + .work-head in polish.css — left-aligned, 46rem column. */
      .mc-shell.mc-work { padding: clamp(2.5rem, 8vh, 5rem) 1.25rem 4rem; }
      .mc-shell.mc-work > div { max-width: 46rem; text-align: left; }
      .mc-work .mc-h1 { margin-top: 0.5rem; }
      .mc-work .mc-intro { margin: 0.5rem 0 0; max-width: 65ch; }
      .mc-eyebrow { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                    font-size: 0.625rem; line-height: 0.875rem; letter-spacing: 0.06em;
                    text-transform: uppercase; color: #737c88; }
      .mc-h1 { margin: 0.5rem 0 0; font-size: 1.5rem; line-height: 2rem; font-weight: 600;
               letter-spacing: -0.025em; text-wrap: balance; color: #e8e6e1; }
      .mc-intro { margin: 0.5rem auto 0; max-width: 34rem; font-size: 0.78125rem;
                  line-height: 1.625; color: #8b929c; text-wrap: balance; }
      @media (min-width: 768px) { .mc-h1 { font-size: 1.875rem; line-height: 2.25rem; } }
      /* The home hero — twins of .home-status/.home-name/.home-role/.home-intro
         in polish.css. Change one, change the other. */
      @font-face { font-family: 'Space Grotesk'; src: url('/fonts/SpaceGrotesk.woff2') format('woff2');
                   font-weight: 300 700; font-style: normal; font-display: swap; }
      .mc-status { display: inline-flex; align-items: center; gap: 0.5rem; margin: 0; padding: 0.25rem 0.75rem;
                   border: 1px solid rgba(154,220,255,0.22); border-radius: 999px; background: rgba(76,201,240,0.06);
                   font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.625rem;
                   line-height: 0.875rem; letter-spacing: 0.16em; text-transform: uppercase; color: #9adcff; }
      .mc-dot { width: 6px; height: 6px; border-radius: 50%; background: #5ef0a8; box-shadow: 0 0 10px #5ef0a8; }
      .mc-name { margin: 0.875rem 0 0; font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
                 font-weight: 700; font-size: clamp(2.25rem, min(6.5vw, 8vh), 4.25rem); line-height: 1.04;
                 letter-spacing: -0.035em; color: #fff; }
      .mc-role { margin: 0.625rem 0 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                 font-size: 0.6875rem; line-height: 1rem; letter-spacing: 0.22em; text-transform: uppercase; color: #4cc9f0; }
      .mc-lede { max-width: 34rem; margin: 0.625rem auto 0; font-size: 0.875rem; line-height: 1.6;
                 color: #8b929c; text-wrap: balance; }
      @media (min-width: 768px) and (max-height: 720px) {
        .mc-status { display: none; }
        .mc-name { margin-top: 0; }
      }
      /* Phones only — twin of .home-pdf in polish.css. */
      .mc-pdf { display: inline-block; margin-top: 0.875rem; padding: 0.375rem 0.75rem;
                border: 1px solid rgba(255,255,255,0.14); border-radius: 3px; background: #0d0f13;
                font-size: 0.6875rem; line-height: 1rem; color: #e8e6e1; text-decoration: none; }
      @media (min-width: 768px) { .mc-pdf { display: none; } }
    </style>
    <script>
      if (/^\/articles(\/|$)/.test(location.pathname)) document.documentElement.classList.add('mc-bare');
    </script>
  </head>
  <body>
    <div id="root">
      <main class="mc-shell">
        <div>
          <p class="mc-status"><span class="mc-dot"></span>Mission Control · All systems go</p>
          <h1 class="mc-name">Cameron Carpenter</h1>
          <p class="mc-role">◇ Applied AI · Performance Marketing ◇</p>
          <p class="mc-lede">Based in Chicago. Writing, the things I’ve built, and a résumé you can pilot.</p>
          <a class="mc-pdf" href="/resume.pdf" download="Cameron-Carpenter-Resume.pdf">Download résumé PDF</a>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
